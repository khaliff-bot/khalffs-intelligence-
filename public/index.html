
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1c">
  <meta name="description" content="KI's - Your intelligent AI assistant.">
  <title>KI's | Khalffs Intelligence</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <div class="app-container">

    <header class="header">
      <div class="logo">
        <span class="logo-icon">KI</span>
        <span>KI's</span>
      </div>
      <span class="brand-name">Khalffs Intelligence</span>
    </header>

    <main class="main-content">
      <section class="welcome-section">
        <h1>Welcome to KI's</h1>
        <p>Your intelligence. Your possibilities.</p>
        <p>Ask anything. Explore everything.</p>
      </section>

      <section class="chat-container">
        <div id="chat-messages" class="chat-messages">
          <div class="message assistant">
            Welcome to KI's! How can I help you today?
          </div>
        </div>

        <form id="chat-form" class="chat-form">
          <input
            type="text"
            id="chat-input"
            placeholder="Message KI's..."
            autocomplete="off"
            required
          >

          <button type="submit" id="send-button">
            Send
          </button>
        </form>
      </section>

      <footer class="footer">
        <p>KI's © 2026 Khalffs Intelligence</p>
        <p>AI can make mistakes. Verify important information.</p>
      </footer>
    </main>

  </div>

  <script src="/app.js"></script>
</body>
</html>
